<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск отеля</title>
<!--  <link rel="stylesheet" href="css/style.css">-->
  <style>
    .search {
      text-align: center;
      padding: 20px;
    }

    #citySelect {
      padding: 10px;
      font-size: 16px;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .hotel {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

  </style>
</head>
<body>
<header>
  <div class="logo">HotBooking</div>
  <nav>
    <a href="/">Главная</a>
    <a href="/about">О нас</a>
    <a href="/contact">Контакты</a>
    <a href="/account">Вход</a>
  </nav>
</header>

<section class="search">
  <h2>Выберите город и найдите отель</h2>
  <select id="citySelect">
    <option value="">Выберите город</option>
  </select>
  <button onclick="loadHotels()">Показать отели</button>

  <div id="hotelList"></div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("http://localhost:8080/api/cities")
            .then(response => response.json())
            .then(data => {
              let citySelect = document.getElementById("citySelect");
              data.forEach(city => {
                let option = document.createElement("option");
                option.value = city.cityId;
                option.textContent = city.cityName;
                citySelect.appendChild(option);
              });
            });
  });

  function loadHotels() {
    let cityId = document.getElementById("citySelect").value;
    if (!cityId) return;

    fetch(`http://localhost:8080/api/hotels/${cityId}`)
            .then(response => response.json())
            .then(data => {
              let hotelList = document.getElementById("hotelList");
              hotelList.innerHTML = "";
              data.forEach(hotel => {
                let div = document.createElement("div");
                div.classList.add("hotel");
                div.innerHTML = `
                            <h3>${hotel.hotelName}</h3>
                            <p>Свободных номеров: ${hotel.availableRooms}</p>
                        `;
                hotelList.appendChild(div);
              });
            });
  }
</script>
</body>
</html>
